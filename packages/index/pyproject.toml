[project]
name = "ingest-index"
version = "0.1.0"
description = "Indexing Worker (container Level 2): workflow, chunk, embedding, ghi Vector DB"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ingest-core",
  "httpx",
  "qdrant-client",
  "langchain-text-splitters",
  "tiktoken",
  "python-frontmatter",
]

[project.scripts]
ingest-index-worker = "ingest.index.worker:main"

[tool.uv.sources]
ingest-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]
