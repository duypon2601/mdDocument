[project]
name = "ingest-cli"
version = "0.1.0"
description = "CLI ingest: gọi Ingestion API qua HTTP (upload, status, list, review, reindex, cancel)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx",
  "typer",
]

[project.scripts]
ingest = "ingest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]
