[project]
name = "ingest-convert"
version = "0.1.0"
description = "Conversion Worker (container Level 2): activity chuyển file gốc sang Markdown, OCR, Vision"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ingest-core",
  "httpx",
  "pymupdf",
  "pymupdf4llm",
  "markitdown[docx,pptx,xlsx]",
  "markdownify",
  "beautifulsoup4",
  "python-frontmatter",
]

[project.optional-dependencies]
docling = ["docling"]
ocr = ["rapidocr-onnxruntime"]

[project.scripts]
ingest-convert-worker = "ingest.convert.worker:main"

[tool.uv.sources]
ingest-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]
