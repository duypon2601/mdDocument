[project]
name = "ingest-core"
version = "0.1.0"
description = "Phần dùng chung: config, model payload Temporal, key storage, Metadata DB, Markdown trung gian"
requires-python = ">=3.12,<3.13"
dependencies = [
  "temporalio>=1.35",
  "pydantic-settings",
  "sqlalchemy>=2",
  "psycopg[binary]",
  "boto3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]
