[project]
name = "ingest-api"
version = "0.1.0"
description = "Ingestion API (container Level 2): nhận file, kiểm tra, lưu bản gốc, khởi động workflow"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ingest-core",
  "fastapi",
  "uvicorn",
  "python-multipart",
  "python-magic",
  "httpx",
  "qdrant-client",
]

[project.scripts]
ingest-api = "ingest.api.main:main"

[tool.uv.sources]
ingest-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]
